# docker-compose.yml

services:
  redis:
    image: redis:7-alpine
    container_name: network_scanner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: network_scanner_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend runs natively on macOS (outside Docker) so it can access the real
  # network interface for nmap scanning and Scapy packet sniffing.
  # Start it manually — see instructions below.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
      # ดึงค่ามาจาก Shell Environment ที่ start.sh สร้างไว้
      - BACKEND_URL=${BACKEND_URL}
    container_name: network_scanner_frontend
    ports:
    - "3000:3000"
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
